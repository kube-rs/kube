[package]
name = "kube-derive"
description = "Custom derives for the kube kubernetes crates"
version.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords = ["kubernetes", "macro", "customresource", "crd"]
categories = ["api-bindings", "encoding"]

[lints]
workspace = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["extra-traits"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
darling.workspace = true

[lib]
proc-macro = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde-saphyr.workspace = true
kube = { path = "../kube", features = ["derive", "client", "cel"] }
schemars = { workspace = true, features = ["jiff02"] }
k8s-openapi = { workspace = true, features = ["latest", "schemars"] }
jiff.workspace = true
trybuild.workspace = true
assert-json-diff.workspace = true
runtime-macros.workspace = true
# runtime-macros uses syn 2 `full` APIs without enabling the feature; darling and prettyplease
# used to enable it for us on syn 2, so turn it on explicitly now that they moved to syn 3.
syn2 = { package = "syn", version = "2", features = ["full"] }
prettyplease.workspace = true
