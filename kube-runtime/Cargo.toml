[package]
name = "kube-runtime"
description = "Kubernetes controller runtime"
version.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords = ["kubernetes", "runtime", "reflector", "watcher", "controller"]
categories = ["web-programming::http-client", "caching", "network-programming"]

[features]
unstable-runtime = ["unstable-runtime-subscribe", "unstable-runtime-stream-control", "unstable-runtime-reconcile-on"]
unstable-runtime-subscribe = []
unstable-runtime-stream-control = []
unstable-runtime-reconcile-on = []

[package.metadata.docs.rs]
features = ["k8s-openapi/latest", "unstable-runtime"]
# Define the configuration attribute `docsrs`. Used to enable `doc_cfg` feature.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
futures = { workspace = true, features = ["async-await"] }
kube-client = { path = "../kube-client", version = "=5.1.0", default-features = false, features = ["jsonpatch", "client"] }
educe = { workspace = true, features = ["Clone", "Debug", "Hash", "PartialEq"] }
serde.workspace = true
ahash.workspace = true
parking_lot.workspace = true
pin-project.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util = { workspace = true, features = ["time"] }
tracing.workspace = true
json-patch.workspace = true
serde_json.workspace = true
thiserror.workspace = true
backon.workspace = true
hashbrown.workspace = true
k8s-openapi.workspace = true
async-broadcast.workspace = true
async-stream.workspace = true

[target.'cfg(any(unix, windows))'.dependencies]
hostname.workspace = true

# Tokio's ctrl_c() only has Unix and Windows support.
# https://github.com/tokio-rs/tokio/blob/tokio-1.54.1/tokio/src/signal/ctrl_c.rs#L1-L4
# Emscripten identifies as Unix, but Tokio disables signals there.
# https://github.com/tokio-rs/tokio/blob/tokio-1.54.1/tokio/src/macros/cfg.rs#L437-L448
[target.'cfg(all(any(unix, windows), not(target_os = "emscripten")))'.dependencies]
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
http.workspace = true
http-body-util.workspace = true
tower.workspace = true
kube = { path = "../kube", features = ["derive", "client", "runtime"] }
serde_json.workspace = true
serde-saphyr.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
rand.workspace = true
schemars.workspace = true
tracing-subscriber.workspace = true
k8s-openapi= { workspace = true, features = ["latest"] }
dhat.workspace = true

[[bench]]
name = "memory"
harness = false
