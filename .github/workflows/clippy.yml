name: clippy
on:
  pull_request:
    paths:
      - '**.rs'
      - '**.toml'
      - '**.yml'

# Spend CI time only on latest ref: https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  # re-runs (attempt > 1) queue behind the newest run instead of cancelling it
  cancel-in-progress: ${{ github.run_attempt == '1' }}

jobs:
  clippy_nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      # same two passes as `just clippy` (justfile documents the e2e/feature reasons)
      - uses: clechasseur/rs-clippy-check@v5
        with:
          args: --workspace --all-features --all-targets --exclude e2e
      - uses: clechasseur/rs-clippy-check@v5
        with:
          args: --workspace --all-targets
